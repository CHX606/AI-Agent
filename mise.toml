# 本地开发环境（mise）。版本号只写在 .node-version 和 .python-version，CI 也读这两个文件。
# 首次使用：安装 mise 并在 PowerShell $PROFILE 中启用后，在项目根目录执行 `mise install`。

[settings]
# 让 mise 读取 .node-version / .python-version，而不是在这里再写一遍版本。
idiomatic_version_file_enable_tools = ["node", "python"]

[env]
# 进入项目目录时自动激活 .venv；不存在时用上面的 Python 创建。
_.python.venv = { path = ".venv", create = true }
