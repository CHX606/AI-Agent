[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-agent"
version = "0.1.0"
description = "Repository-level AI coding agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = {"" = "services/agent/src"}

[tool.setuptools.packages.find]
where = ["services/agent/src"]

[tool.pytest.ini_options]
testpaths = ["services/agent/tests"]
pythonpath = ["services/agent/src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]