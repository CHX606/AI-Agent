[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bit-agent"
version = "0.1.0"
description = "Repository-level AI coding agent"
requires-python = ">=3.12"
dependencies = [
    "packaging>=24,<27",
    "mcp>=2.1,<3",
    "openai>=3.3,<4",
    "httpx2>=2.12,<3",
    "openai-agents==0.22.1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
bit-agent = "bit_agent.cli:main"

[project.optional-dependencies]
dev = [
    "import-linter>=2.15,<3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]
memory = [
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
]

[tool.setuptools]
package-dir = {"" = "services/agent/src"}

[tool.setuptools.packages.find]
where = ["services/agent/src"]

[tool.pytest.ini_options]
testpaths = ["services/agent/tests"]
pythonpath = ["services/agent/src"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".pytest-tmp", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_package = "bit_agent"

[[tool.importlinter.contracts]]
name = "Runtime business uses ports, never concrete adapters or transport"
type = "forbidden"
source_modules = ["bit_agent.runtime.application"]
forbidden_modules = ["bit_agent.runtime.infrastructure", "bit_agent.runtime.transport", "bit_agent.runtime.bootstrap"]

[[tool.importlinter.contracts]]
name = "Runtime domain is independent"
type = "forbidden"
source_modules = ["bit_agent.runtime.domain"]
forbidden_modules = ["bit_agent.runtime.application", "bit_agent.runtime.infrastructure", "bit_agent.runtime.transport", "bit_agent.runtime.bootstrap"]

[[tool.importlinter.contracts]]
name = "RPC depends on method contracts, never business or persistence"
type = "forbidden"
source_modules = ["bit_agent.runtime.transport"]
forbidden_modules = ["bit_agent.runtime.application", "bit_agent.runtime.infrastructure", "bit_agent.runtime.bootstrap"]

[[tool.importlinter.contracts]]
name = "Runtime adapters may use ports but cannot call business orchestration"
type = "forbidden"
source_modules = ["bit_agent.runtime.infrastructure"]
forbidden_modules = ["bit_agent.runtime.application.service", "bit_agent.runtime.application.delegation", "bit_agent.runtime.application.interaction", "bit_agent.runtime.transport", "bit_agent.runtime.bootstrap"]
