packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  # 用自带的 N-API 预编译文件（prebuilds/win32-x64），不需要本机编译。
  node-pty: false

# dependency-cruiser's optional parser must not resolve the applications' TS 7.
packageExtensions:
  'dependency-cruiser@18':
    dependencies:
      typescript: '^6.0.3'

# One store for this workspace and every package, independent of the shell cwd.
storeDir: 'D:/myproject/AI Agent.pnpm-store'
overrides:
  '@anthropic-ai/sandbox-runtime>zod': '3.25.76'
