name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 项目面向 Windows（便携 exe、PowerShell 脚本），pnpm-workspace.yaml 的 storeDir 也是 D: 盘绝对路径，
# 所以 CI 同样跑在 Windows 上。Docker、PostgreSQL 和真实模型相关测试会按原有条件自动跳过。
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          # 与 mise.toml 中的 uv 版本保持一致。
          version: "0.12.19"
          enable-cache: true
      - name: Install ripgrep
        run: choco install ripgrep --no-progress -y
      - name: Install dependencies
        # --locked：uv.lock 与 pyproject.toml 不一致时直接失败。
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check services/agent
      - name: Ruff format
        run: uv run --locked ruff format --check services/agent
      - name: Architecture contracts
        run: node scripts/check-python-architecture.mjs
      - name: Tests
        run: uv run --locked pytest

  node:
    runs-on: windows-latest
    env:
      # 单元测试不启动 Electron，跳过二进制下载以节省时间。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Gateway 的诊断测试会启动真实的 Python 执行进程，需要项目的 .venv。
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Architecture boundaries
        run: pnpm architecture:js
